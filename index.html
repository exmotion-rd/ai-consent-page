<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ファイル利用に関する同意</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 760px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.8;
      color: #222;
    }

    .box {
      border: 1px solid #d0d7de;
      padding: 28px;
      border-radius: 10px;
      background: #fff;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }

    .filename {
      padding: 12px;
      background: #f6f8fa;
      border-radius: 6px;
      word-break: break-all;
      margin-bottom: 20px;
    }

    .notice {
      border-left: 4px solid #d1242f;
      padding-left: 14px;
      margin: 20px 0;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 24px;
      font-size: 16px;
    }

    button {
      margin-top: 24px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .error {
      color: #d1242f;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ファイル利用に関する同意</h1>

    <div class="filename" id="fileNameArea">
      対象ファイルを確認中...
    </div>

    <p>
      このファイルには、社内または関係者向けの情報が含まれている可能性があります。
      ファイルを開く前に、以下の内容を確認してください。
    </p>

    <div class="notice">
      このファイルの内容を、ChatGPT、Copilot、Gemini、Claude等の生成AIサービスへ投入しないでください。
    </div>

    <ul>
      <li>生成AIサービスへ入力しない</li>
      <li>社外へ無断共有しない</li>
      <li>無断転載しない</li>
      <li>二次配布しない</li>
      <li>業務目的以外で利用しない</li>
    </ul>

    <label>
      <input type="checkbox" id="agreeCheck">
      上記内容に同意します
    </label>

    <button id="openButton" disabled>
      同意してファイルを開く
    </button>

    <div class="error" id="errorMessage">
      ファイル情報を取得できませんでした。SharePointのリンク設定を確認してください。
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const fileName = params.get("fileName") || "対象ファイル";
    const filePath = params.get("filePath");

    const fileUrl = filePath
      ? "https://exmotionms.sharepoint.com" + filePath
      : "";

    const fileNameArea = document.getElementById("fileNameArea");
    const agreeCheck = document.getElementById("agreeCheck");
    const openButton = document.getElementById("openButton");
    const errorMessage = document.getElementById("errorMessage");

    fileNameArea.textContent = "対象ファイル：" + fileName;

    if (!fileUrl) {
      errorMessage.style.display = "block";
    }

    agreeCheck.addEventListener("change", function () {
      openButton.disabled = !agreeCheck.checked;
    });

    openButton.addEventListener("click", function () {
      if (!fileUrl) {
        errorMessage.style.display = "block";
        return;
      }

      window.open(fileUrl, "_blank", "noopener");
    });
  </script>
</body>
</html>
