<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ファイル利用に関する同意</title>

<style>
body{
    font-family: sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    line-height: 1.8;
}

.container{
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px;
}

.notice{
    background: #fff8e1;
    border-left: 4px solid #ff9800;
    padding: 12px;
    margin: 20px 0;
}

button{
    background: #0078d4;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    cursor: pointer;
}

button:disabled{
    background: #999;
    cursor: not-allowed;
}
</style>

</head>
<body>

<div class="container">

<h2>ファイル利用に関する同意</h2>

<p id="fileName">
対象ファイルを確認中...
</p>

<ul>  
<li>社外へ無断共有しない</li>
<li>無断転載しない</li>
<li>二次配布しない（社内の二次配布も禁止です）</li>
<li>生成AIサービスへ入力しない</li>
<li>業務目的以外で利用しない</li>
</ul>

<label>
<input type="checkbox" id="agree">
上記内容に同意します
</label>

<br><br>

<button id="openBtn" disabled>
同意してファイルを開く
</button>

</div>

<script>

// ===== ファイル一覧 =====

const files = {

  "1": {
    name: "要件定義実践教育テキスト.pdf",
    url: "https://exmotionms.sharepoint.com/:b:/s/EurekaBox/IQASW8VeH4v4TYTbsR1jTXoiASKBOkxXWsb7DoaW20qmiSg?e=Za6c7a"
//  },
//
//  "2": {
//    name: "技術資料.pdf",
//    url: "ここにSharePoint共有リンク②"
  }

};

// ======================

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

const file = files[id];

const fileName = document.getElementById("fileName");
const agree = document.getElementById("agree");
const openBtn = document.getElementById("openBtn");

if(file){

    fileName.textContent =
      "対象ファイル: " + file.name;

}else{

    fileName.innerHTML =
      "<span style='color:red'>対象ファイルが見つかりません</span>";

}

agree.addEventListener("change", () => {

    openBtn.disabled = !agree.checked;

});

openBtn.addEventListener("click", () => {

    if(!file){
        return;
    }

    window.open(file.url, "_blank");

});

</script>

</body>
</html>
